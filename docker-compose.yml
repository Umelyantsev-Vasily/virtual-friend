version: '3.8'

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: virtual_friend_postgres
    environment:
      POSTGRES_USER: friend
      POSTGRES_PASSWORD: friend123
      POSTGRES_DB: virtual_friend
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U friend"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: virtual_friend_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
  redis_data: